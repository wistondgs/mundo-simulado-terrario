scenario:
  name: "d4_change"
  description: "Rules reverse at step 750. Tests adaptation to causal change."
  grid_size: [10, 10]
  duration: 1500
  seed: 42
  view_radius: 2
  num_channels: 4
  objects:
    - pos: [2, 3]
      channels: [0.9, 0.2, 0.1, 0.0]
      movable: true
      energy_value: 8.0
    - pos: [4, 7]
      channels: [0.85, 0.3, 0.2, 0.1]
      movable: true
      energy_value: 8.0
    - pos: [7, 2]
      channels: [0.8, 0.1, 0.0, 0.2]
      movable: true
      energy_value: 8.0
    - pos: [1, 8]
      channels: [0.1, 0.8, 0.3, 0.1]
      movable: true
      energy_value: -4.0
    - pos: [6, 5]
      channels: [0.15, 0.7, 0.1, 0.0]
      movable: true
      energy_value: -4.0
    - pos: [8, 4]
      channels: [0.2, 0.9, 0.2, 0.3]
      movable: true
      energy_value: -4.0
  agent_start:
    pos: [5, 5]
    energy: 100.0
  rules:
    rules:
      - id: "rule_001"
        condition:
          object_channel: {index: 0, min: 0.7}
          action: "CONSUME"
        effect:
          energy_delta: 8.0
          destroy_object: true
      - id: "rule_002"
        condition:
          object_channel: {index: 0, max: 0.3}
          action: "CONSUME"
        effect:
          energy_delta: -4.0
          destroy_object: true
  changes:
    - at_step: 750
      rules:
        rules:
          - id: "rule_001_reversed"
            condition:
              object_channel: {index: 0, min: 0.7}
              action: "CONSUME"
            effect:
              energy_delta: -4.0
              destroy_object: true
          - id: "rule_002_reversed"
            condition:
              object_channel: {index: 0, max: 0.3}
              action: "CONSUME"
            effect:
              energy_delta: 8.0
              destroy_object: true
