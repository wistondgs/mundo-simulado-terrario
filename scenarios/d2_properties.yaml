scenario:
  name: "d2_properties"
  description: "Movable vs immovable objects with different channel signatures. Tests learning functional properties."
  grid_size: [10, 10]
  duration: 800
  seed: 42
  view_radius: 2
  num_channels: 4
  objects:
    # Movable objects — higher ch2
    - pos: [2, 3]
      channels: [0.3, 0.2, 0.9, 0.1]
      movable: true
      energy_value: 5.0
    - pos: [5, 6]
      channels: [0.2, 0.3, 0.85, 0.0]
      movable: true
      energy_value: 5.0
    - pos: [7, 1]
      channels: [0.4, 0.1, 0.8, 0.2]
      movable: true
      energy_value: 5.0
    # Immovable objects — lower ch2, higher ch3
    - pos: [1, 7]
      channels: [0.3, 0.2, 0.1, 0.9]
      movable: false
      energy_value: -3.0
    - pos: [6, 4]
      channels: [0.2, 0.4, 0.15, 0.85]
      movable: false
      energy_value: -3.0
    - pos: [8, 8]
      channels: [0.1, 0.3, 0.2, 0.8]
      movable: false
      energy_value: -3.0
  agent_start:
    pos: [5, 5]
    energy: 100.0
  rules:
    rules:
      - id: "rule_001"
        condition:
          object_channel: {index: 2, min: 0.7}
          action: "CONSUME"
        effect:
          energy_delta: 5.0
          destroy_object: true
      - id: "rule_002"
        condition:
          object_channel: {index: 3, min: 0.7}
          action: "CONSUME"
        effect:
          energy_delta: -3.0
          destroy_object: false
  changes: []
