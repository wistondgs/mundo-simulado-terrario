scenario:
  name: "d4_adaptation_scientific"
  observer_phases: ["ACQUISITION", "CAUSAL_CHANGE", "RECOVERY"]
  grid_size: [14, 14]
  duration: 1000
  max_energy: 100.0
  step_energy_cost: 0.06
  expose_time_fraction: false
  seed: 42
  view_radius: 2
  num_channels: 4
  agent_start:
    pos: [7, 7]
    energy: 60.0
  procedural_layout:
    placement_margin: 1
    class_templates:
      A:
        count: 16
        channels: [0.82, 0.18, 0.35, 0.12]
      B:
        count: 16
        channels: [0.18, 0.82, 0.12, 0.35]
  opportunity_lifecycle:
    cooldown_steps: [3, 8]
    minimum_agent_distance: 2
    placement_margin: 1
    recent_position_exclusion: 2
  rules:
    rules:
      - id: "causal_A_positive"
        condition:
          object_channel: {index: 0, min: 0.70}
          action: "CONSUME"
        effect: {energy_delta: 1.0, destroy_object: true}
      - id: "causal_B_negative"
        condition:
          object_channel: {index: 0, max: 0.30}
          action: "CONSUME"
        effect: {energy_delta: -1.0, destroy_object: true}
  change_jitter: 25
  changes:
    - at_step: 450
      rules:
        rules:
          - id: "causal_A_negative"
            condition:
              object_channel: {index: 0, min: 0.70}
              action: "CONSUME"
            effect: {energy_delta: -1.0, destroy_object: true}
          - id: "causal_B_positive"
            condition:
              object_channel: {index: 0, max: 0.30}
              action: "CONSUME"
            effect: {energy_delta: 1.0, destroy_object: true}
