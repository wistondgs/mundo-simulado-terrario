scenario:
  name: "d4_change_fast"
  description: "CI wiring scenario. PRE_STEP rule reversal at step 10."
  grid_size: [6, 6]
  duration: 30
  seed: 42
  view_radius: 2
  num_channels: 4
  objects:
    - pos: [2, 3]
      channels: [0.9, 0.2, 0.1, 0.0]
      movable: true
      energy_value: 8.0
  agent_start:
    pos: [3, 3]
    energy: 100.0
  rules:
    rules:
      - id: "rule_before"
        condition:
          object_channel: {index: 0, min: 0.7}
          action: "CONSUME"
        effect: {energy_delta: 8.0, destroy_object: false}
  changes:
    - at_step: 10
      rules:
        rules:
          - id: "rule_after"
            condition:
              object_channel: {index: 0, min: 0.7}
              action: "CONSUME"
            effect: {energy_delta: -4.0, destroy_object: false}
