[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrario"
version = "0.1.0"
description = "Deterministic experimental world for cognitive-agent research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "torch==2.5.1",
]

[project.optional-dependencies]
observer = ["safetensors>=0.4", "pyarrow>=15", "zarr>=2.17"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["terrario*"]
